      security:
        - CognitoAuth: []

  /health:
    get:
      summary: Health check endpoint
      description: Check system health
      operationId: healthCheck
      tags:
        - System
      responses:
        '200':
          description: System healthy
          content:
            application/json:
              schema:
                type: object
              example:
                status: "ok"
                timestamp: "2024-01-15T10:30:00Z"
                version: "1.0.0"
                environment: "production"
                checks:
                  lambda:
                    status: "ok"
                    message: "Lambda function running"
                  airtable:
                    status: "ok"
                    latencyMs: 250
                    message: "Connected successfully"
                  dynamodb:
                    status: "ok"
                    latencyMs: 15
                    message: "Connected successfully"
                  configuration:
                    status: "ok"
                    latencyMs: 10
                    message: "Configuration loaded successfully"
                uptime: 3600
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: System unhealthy
          content:
            application/json:
              schema:
                type: object
      security: []

tags:
  - name: Dashboard
    description: Dashboard data and KPIs
  - name: Attendance
    description: Service attendance tracking
  - name: Members
    description: Member management
  - name: Follow-up
    description: Follow-up assignments
  - name: Admin
    description: Administrative views
  - name: System
    description: System health
