  /query/journey:
    get:
      summary: Get member journey
      description: Retrieve complete journey for a member
      operationId: getMemberJourney
      tags:
        - Members
      parameters:
        - name: memberId
          in: query
          required: true
          schema:
            type: string
          example: "rec456def"
        - name: refresh
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
