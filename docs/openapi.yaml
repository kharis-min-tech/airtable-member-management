        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - CognitoAuth: []

  /query/follow-up:
    get:
      summary: Get follow-up data
      description: Retrieve follow-up assignments and interactions
      operationId: getFollowUp
      tags:
        - Follow-up
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: refresh
          in: query
          schema:
